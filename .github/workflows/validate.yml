name: Validate Catalog

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install CLI
        run: |
          cd catalog-cli
          pip install -e .

      - name: Check CLI help
        run: |
          catalog --help
          catalog servicos --help

      - name: Run tests
        run: |
          cd catalog-cli
          pytest tests/ -v
